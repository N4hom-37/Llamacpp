name: Build llama.cpp Shared Bundle (Alpine 3.23 ARM64)

on:
  workflow_dispatch:

jobs:
  build-shared:
    name: Compile Shared Libs, Tools, and Headers
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp

      - name: Build inside Alpine Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app alpine:3.23 /bin/sh -c "
            apk add --no-cache gcc g++ make cmake openblas-dev linux-headers musl-dev libstdc++ git pkgconfig && \
            
            cmake -B build \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS \
              -DCMAKE_PREFIX_PATH=/usr \
              -DLLAMA_NATIVE=OFF -DGGML_NATIVE=OFF -DLLAMA_NEON=ON \
              -DGGML_ARM_DOTPROD=OFF -DGGML_ARM_FMA=OFF && \
            
            cmake --build build --config Release -j\$(nproc) && \
            
            mkdir -p dist/bin dist/include dist/scripts
            
            # 1. Collect all .so files
            find build -name '*.so' -exec cp {} dist/bin/ \;
            
            # 2. Collect header files
            cp include/*.h dist/include/ 2>/dev/null || true
            find ggml/include -name '*.h' -exec cp {} dist/include/ \; 2>/dev/null || true
            
            # 3. Collect requested binaries
            [ -f build/bin/llama-quantize ] && cp build/bin/llama-quantize dist/bin/
            [ -f build/bin/llama-mtmd-cli ] && cp build/bin/llama-mtmd-cli dist/bin/
            
            # 4. Include conversion scripts
            cp convert*.py dist/scripts/ 2>/dev/null || true
            cp -r gguf-py dist/scripts/ 2>/dev/null || true"

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-shared-bundle-arm64
          path: dist/
          
