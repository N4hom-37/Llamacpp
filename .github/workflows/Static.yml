name: Build Static llama-server (Alpine 3.23 ARM64)

on:
  workflow_dispatch:

jobs:
  build-static-server:
    name: Compile Static llama-server
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp

      - name: Compile Static Binary
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app alpine:3.23 /bin/sh -c "
            # Removed openblas-dev to stop the 'Not Found' errors
            apk add --no-cache gcc g++ make cmake linux-headers musl-dev libstdc++ git && \
            
            cmake -B build \
              -DLLAMA_STATIC=ON \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_EXE_LINKER_FLAGS='-static' \
              -DGGML_BLAS=OFF \
              -DLLAMA_NATIVE=OFF \
              -DGGML_NATIVE=OFF \
              -DLLAMA_NEON=ON \
              -DGGML_ARM_DOTPROD=OFF \
              -DGGML_ARM_FMA=OFF && \
            
            cmake --build build --config Release --target llama-server -j\$(nproc) && \
            
            mkdir -p dist && \
            cp build/bin/llama-server dist/ && \
            strip dist/llama-server"

      - name: Upload Static Server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-static-arm64
          path: dist/llama-server
