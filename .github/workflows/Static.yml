name: Build Static llama-server (Makefile + Alpine ARM64)

on:
  workflow_dispatch:

jobs:
  build-static-server:
    name: Compile Static llama-server
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp

      - name: Compile Static Binary
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app alpine:3.23 /bin/sh -c "
            # Install build tools and the static version of OpenBLAS
            apk add --no-cache gcc g++ make openblas-dev openblas-static linux-headers musl-dev libstdc++ git gfortran pkgconfig && \
            
            # Use the raw Makefile instead of CMake
            # We explicitly pass your ARM64 flags and force static linking
            # LLAMA_SERVER=1 tells the Makefile to build the server binary
            make -j\$(nproc) llama-server \
              LLAMA_STATIC=1 \
              GGML_OPENBLAS=1 \
              LDFLAGS='-static -L/usr/lib -lopenblas -lgfortran' \
              GGML_NO_NATIVE=1 \
              GGML_NEON=1 \
              GGML_ARM_DOTPROD=0 \
              GGML_FMA=1 && \
            
            mkdir -p dist && \
            cp llama-server dist/ && \
            strip dist/llama-server"

      - name: Upload Static Server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-static-arm64
          path: dist/llama-server
          
